# 01-hello: one blocking chat against the mock provider.
#
# Base config, shared across variants: the provider, each agent's wiring and the
# assertions. The per-variant `omw.test.toml` adds only the runtime kind and
# brain scripts. Run the case with `omw-test run examples/01-hello`.

[providers.openai]
kind = "mock"
turns = [{ content = "hello, world" }]

[agents.alice]
runtime = "runtime"

[assertions.alice]
outcome = "completed"
events = [
  { kind = "call", op = "chat" },
]
