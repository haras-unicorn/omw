# 04-ping-pong: two agents, one shared brain, no provider or tooling.
#
# Shared across variants. `dev format` expands this into each
# `<variant>/omw.test.toml`; run the case with
# `omw-test run examples/04-ping-pong`.

[runtime.runtime]
kind = "rhai"

[[agents]]
name = "alice"
runtime = "runtime"
script = "brain.rhai"

[[agents]]
name = "bob"
runtime = "runtime"
script = "brain.rhai"

[assertions.alice]
outcome = "completed"
events = [
  { kind = "call", op = "whoami" },
  { kind = "call", op = "subscribe_agent" },
  { kind = "call", op = "memory_set" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "unsubscribe_agent" },
]

[assertions.bob]
outcome = "completed"
events = [
  { kind = "call", op = "whoami" },
  { kind = "call", op = "subscribe_agent" },
  { kind = "call", op = "memory_set" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "unsubscribe_agent" },
]
