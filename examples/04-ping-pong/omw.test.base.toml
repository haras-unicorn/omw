# 04-ping-pong: two agents, one shared brain, no provider or tooling.
#
# Base config, shared across variants: each agent's wiring and the assertions.
# The per-variant `omw.test.toml` adds only the runtime kind and brain scripts.
# Run the case with `omw-test run examples/04-ping-pong`.

[agents.alice]
runtime = "runtime"

[agents.bob]
runtime = "runtime"

[assertions.alice]
outcome = "completed"
events = [
  { kind = "call", op = "whoami" },
  { kind = "call", op = "subscribe_agent" },
  { kind = "call", op = "memory_set" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "unsubscribe_agent" },
]

[assertions.bob]
outcome = "completed"
events = [
  { kind = "call", op = "whoami" },
  { kind = "call", op = "subscribe_agent" },
  { kind = "call", op = "memory_set" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "send_agent" },
  { kind = "inbound", event = "message" },
  { kind = "call", op = "unsubscribe_agent" },
]
