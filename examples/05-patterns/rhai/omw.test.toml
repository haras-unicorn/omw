# 05-patterns: assertions over a multi-turn provider script.
#
# Shared across variants. `dev format` expands this into each
# `<variant>/omw.test.toml`; run the case with
# `omw-test run examples/05-patterns`.

[providers.openai]
kind = "mock"
turns = [
  { content = "alpha" },
  { content = "beta" },
  { content = "gamma" },
]

[runtime.runtime]
kind = "rhai"

[[agents]]
name = "alice"
runtime = "runtime"
script = "brain.rhai"

# Four chats, but only three assertions and none of them has to name every
# event: string leaves are regexes, `$while` consumes the middle run, `$until`
# skips to the final match, and unlisted events are ignored.
[assertions.alice]
outcome = "completed"
events = [
  { kind = "call", op = "chat", detail = { model = "^gpt-a.*" } },
  { "$while" = { kind = "call", op = "chat", detail = { model = "^gpt-[bg].*" } } },
  { "$until" = { kind = "call", op = "chat", detail = { model = "^gpt-a.*" } } },
]
