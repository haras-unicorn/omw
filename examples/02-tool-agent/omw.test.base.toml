# 02-tool-agent: a ReAct loop against the mock provider and mock tooling.
#
# Base config, shared across variants: the provider, the tooling, each agent's
# wiring and the assertions. The per-variant `omw.test.toml` adds only the
# runtime kind and brain scripts. Run the case with
# `omw-test run examples/02-tool-agent`.

[providers.openai]
kind = "mock"
turns = [
  { tool_call = { id = "call-1", name = "echo", arguments = '{"input":"hi"}' } },
  { content = "done" },
]

[tooling.mcp]
kind = "mock"
tool_calls = [{ name = "echo", result = "hi" }]

[agents.alice]
runtime = "runtime"

[assertions.alice]
outcome = "completed"
events = [
  { kind = "call", op = "chat" },
  { kind = "call", op = "call_tool_blocking" },
  { kind = "call", op = "chat" },
]
