# 06-memory: seeded memory fast-forwards an agent to a state.
#
# Base config, shared across variants: the provider, the seeded memory, each
# agent's wiring and the assertions. The per-variant `omw.test.toml` adds only
# the runtime kind and brain scripts. Run the case with
# `omw-test run examples/06-memory`.

[providers.openai]
kind = "mock"
turns = [{ content = "seeded reply" }]

# Inserted into alice's memory before her brain first runs. She reads it and
# picks the model name from it, so the seeded value shows up in the trace.
# A table seed is stored JSON-encoded and read back parsed via `memory_get_as`.
[memory.alice]
state = { model = "seed-42", retries = 3 }

[agents.alice]
runtime = "runtime"

[assertions.alice]
outcome = "completed"
events = [
  { kind = "call", op = "memory_get", detail = { key = "state" } },
  { kind = "call", op = "chat", detail = { model = "seed-42" } },
]
