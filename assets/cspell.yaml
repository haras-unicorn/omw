# yaml-language-server: $schema=https://raw.githubusercontent.com/streetsidesoftware/cspell/refs/heads/main/cspell.schema.json
useGitignore: true
version: "0.2"
language: en
ignorePaths:
  - schema.json
  - schema.test.json
ignoreWords:
  - tzdata
  - adduser
  - bwrap
  - netlink
  - suidsgid
  - rlimit
  - memlock
  - eperm
  - pageable
