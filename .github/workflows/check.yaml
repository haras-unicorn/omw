name: check

on:
  pull_request: {}

jobs:
  lint-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
      - uses: cachix/cachix-action@v15
        with:
          name: haras
          extraPullNames: haras-releases
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix develop .#ci --command dev lint check

  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
      - uses: cachix/cachix-action@v15
        with:
          name: haras
          extraPullNames: haras-releases
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix develop .#ci --command dev lint test

  lint-nix:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
      - uses: cachix/cachix-action@v15
        with:
          name: haras
          extraPullNames: haras-releases
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix flake check --show-trace

  lint-build:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes auto-allocate-uids cgroups
            auto-allocate-uids = true
      - uses: cachix/cachix-action@v15
        with:
          name: haras
          extraPullNames: haras-releases
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: nix build --show-trace .#omw-tarball
