[package]
name = "omw"
version = "0.1.1"
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[features]
default = []
rhai = []
mock = []

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
config = "0.15.25"
cron = { version = "0.17.0", features = ["serde"] }
futures = "0.3.34"
futures-util = "0.3.34"
kanal = "0.1.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rmcp = { version = "3.1.4", features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "chrono",
  "json",
] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wat.workspace = true

[build-dependencies]
wasmtime.workspace = true

[dev-dependencies]
hyper-util = { version = "0.1.20", features = ["server"] }
rmcp = { version = "3.1.4", features = ["server", "transport-async-rw", "transport-streamable-http-server", "tower"] }
serial_test = "4.0.1"
tempfile = "3.27.0"
testcontainers = "0.28.0"
wiremock = "0.6.5"
