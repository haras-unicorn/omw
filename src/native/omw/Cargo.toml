[package]
name = "omw"
version = "0.1.1"
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[features]
default = ["tooling-mcp", "provider-openai", "runtime-wasm", "endpoint-openai"]
runtime-wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat"]
runtime-rhai = ["runtime-wasm"]
runtime-js = ["runtime-wasm"]
provider-openai = ["dep:reqwest"]
tooling-mcp = ["dep:rmcp"]
endpoint-openai = ["dep:axum"]
mock = ["runtime-wasm"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
config = "0.15.25"
cron = { version = "0.17.0", features = ["serde"] }
dashmap = { version = "6.2.1", features = ["serde"] }
futures = "0.3.34"
futures-util = "0.3.34"
kanal = "0.1.1"
notify = { version = "8.2.0", features = ["serde"] }
notify-debouncer-mini = "0.7.0"
os-memlock = "0.2.0"
reqwest = { version = "0.13.4", features = ["json", "stream"], optional = true }
rmcp = { version = "3.1.4", optional = true, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "chrono",
  "json",
] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wat = { workspace = true, optional = true }
zeroize = { version = "1.9.0", features = ["derive", "serde"] }

[build-dependencies]
wasmtime.workspace = true

[dev-dependencies]
reqwest = { version = "0.13.4", features = ["json", "stream"] }
async-openai = { version = "0.41.3", features = ["chat-completion", "model"] }
hyper-util = { version = "0.1.20", features = ["server"] }
rmcp = { version = "3.1.4", features = [
  "server",
  "transport-async-rw",
  "transport-streamable-http-server",
  "tower",
] }
serial_test = "4.0.1"
tempfile = "3.27.0"
testcontainers = "0.28.0"
wiremock = "0.6.5"
