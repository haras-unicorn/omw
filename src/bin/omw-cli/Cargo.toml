[package]
name = "omw-cli"
version = "0.1.4"
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[[bin]]
name = "omw"
path = "src/main.rs"

[features]
default = ["tooling-mcp", "provider-openai", "runtime-wasm", "endpoint-openai"]
runtime-wasm = ["omw/runtime-wasm"]
runtime-rhai = ["omw/runtime-rhai"]
runtime-js = ["omw/runtime-js"]
provider-openai = ["omw/provider-openai"]
tooling-mcp = ["omw/tooling-mcp"]
endpoint-openai = ["omw/endpoint-openai"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
rustls.workspace = true
clap.workspace = true
config.workspace = true
toml.workspace = true
omw = { version = "0.1.4", path = "../../lib/omw", default-features = false }
omw-output = { path = "../../lib/omw-output" }

[dev-dependencies]
nix.workspace = true
serial_test.workspace = true
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
