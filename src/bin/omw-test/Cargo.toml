[package]
name = "omw-test"
version = "0.1.4"
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[features]
default = ["runtime-wasm", "runtime-rhai", "runtime-js"]
runtime-wasm = ["omw/runtime-wasm"]
runtime-rhai = ["omw/runtime-rhai"]
runtime-js = ["omw/runtime-js"]
# Internal helper: cross-build single-file rust brains for wasm32-wasip2. Only
# the dev shell enables it; it assumes the in-repo SDK layout and is not a
# supported user workflow.
compile-wasm = []

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
rustls.workspace = true
clap.workspace = true
config.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
toml.workspace = true
omw = { version = "0.1.4", path = "../../lib/omw", default-features = false, features = [
  "mock",
] }
omw-output = { path = "../../lib/omw-output" }
glob = "0.3.4"

[dev-dependencies]
nix.workspace = true
serial_test.workspace = true
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
