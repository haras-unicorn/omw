[package]
name = "omw"
version = "0.1.1"
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true

[features]
default = ["tooling-mcp", "provider-openai", "runtime-wasm", "endpoint-openai"]
runtime-wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wat"]
runtime-rhai = ["runtime-wasm"]
runtime-js = ["runtime-wasm"]
provider-openai = ["dep:reqwest", "rustls"]
tooling-mcp = ["dep:rmcp", "rustls"]
endpoint-openai = ["dep:axum"]
mock = ["runtime-wasm"]
rustls = ["dep:rustls"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
schemars.workspace = true
serde_json.workspace = true
rustls = { workspace = true, optional = true }
async-trait = "0.1.92"
axum = { version = "0.8.9", optional = true }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
cron = { version = "0.17.0", features = ["serde"] }
dashmap = { version = "6.2.1", features = ["serde"] }
futures = "0.3.34"
futures-util = "0.3.34"
kanal = "0.1.1"
notify = { version = "8.2.0", features = ["serde"] }
notify-debouncer-mini = "0.7.0"
os-memlock = "0.2.0"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "stream",
  "rustls-no-provider",
], optional = true }
rmcp = { version = "3.1.4", optional = true, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
serde = { version = "1.0.229", features = ["derive"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }
wasmtime = { workspace = true, optional = true }
wasmtime-wasi = { workspace = true, optional = true }
wat = { workspace = true, optional = true }
zeroize = { version = "1.9.0", features = ["derive", "serde"] }

[build-dependencies]
wasmtime.workspace = true

[dev-dependencies]
rustls.workspace = true
async-openai = { version = "0.41.3", features = [
  "chat-completion",
  "model",
  "rustls-no-provider",
] }
hyper-util = { version = "0.1.20", features = ["server"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "stream",
  "rustls-no-provider",
] }
rmcp = { version = "3.1.4", features = [
  "server",
  "transport-async-rw",
  "transport-streamable-http-server",
  "tower",
] }
serial_test = "4.0.1"
tempfile = "3.27.0"
testcontainers = "0.28.0"
wiremock = "0.6.5"
toml = "1.1.6"
