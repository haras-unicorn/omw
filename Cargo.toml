[workspace]
resolver = "2"
members = ["src/lib/*", "src/bin/*", "src/wasm/*"]
default-members = ["src/lib/*", "src/bin/*"]

[workspace.package]
description = "OMW = OpenAI + MCP + WASM"
repository = "https://github.com/haras-unicorn/omw"
authors = ["haras-unicorn <github@haras-unicorn.net>"]
license = "MIT"
readme = "./README.md"
edition = "2024"

[workspace.dependencies]
wit-bindgen = "0.61.1"
wasmtime = { version = "48.0.1", features = ["component-model"] }
wasmtime-wasi = "48.0.1"
wat = { version = "1.258.0", features = ["component-model"] }
wasmprinter = "0.258.0"
anyhow = "1.0.104"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "env-filter",
  "chrono",
  "json",
] }
schemars = "1.2.2"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
config = { version = "0.15.25" }
