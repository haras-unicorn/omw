[workspace]
release = false

[[package]]
name = "omw"
release = true
version_group = "omw"
publish_allow_dirty = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
changelog_include = ["omw-cli", "omw-test"]

[[package]]
name = "omw-wasm-rust"
release = true
git_tag_enable = false
git_release_enable = false

[[package]]
name = "omw-cli"
release = true
version_group = "omw"
git_tag_enable = false
git_release_enable = false
semver_check = false

[[package]]
name = "omw-test"
release = true
version_group = "omw"
git_tag_enable = false
git_release_enable = false
semver_check = false
